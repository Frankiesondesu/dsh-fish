<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>她 · 管理器</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#14171f; --panel2:#191d27;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.11);
    --fg:#e9ebf2; --dim:#8b93a7; --dim2:#5f6779;
    --ok:#4ade80; --warn:#f5bd62; --bad:#f0788a; --acc:#8aa4ff;
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",
      "PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    font-size:14px; -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(900px 500px at 15% -10%, rgba(138,164,255,.10), transparent 60%),
      radial-gradient(700px 400px at 95% 0%, rgba(167,139,250,.08), transparent 55%);
    background-attachment:fixed;
  }

  /* ---------- 顶栏 ---------- */
  header{
    position:sticky; top:0; z-index:20;
    backdrop-filter:blur(16px) saturate(140%);
    background:rgba(11,13,18,.78);
    border-bottom:1px solid var(--line);
  }
  .bar{
    max-width:1180px; margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:11px; font-size:15px; font-weight:640; letter-spacing:.2px}
  .mark{
    width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
    background:linear-gradient(145deg,#8aa4ff,#a78bfa); color:#0b0d12;
    font-weight:700; font-size:15px; box-shadow:0 4px 14px rgba(138,164,255,.28);
  }
  .spacer{flex:1}

  .summary{
    display:flex; align-items:center; gap:8px;
    padding:6px 13px; border-radius:999px;
    border:1px solid var(--line); background:var(--panel);
    font-size:12.5px; color:var(--dim); white-space:nowrap;
  }
  .summary b{color:var(--fg); font-variant-numeric:tabular-nums}

  .bulk{display:flex; gap:8px; flex-wrap:wrap}

  /* ---------- 按钮 ---------- */
  button{
    font:inherit; font-size:12.5px; font-weight:560;
    padding:7px 14px; border-radius:9px; cursor:pointer;
    border:1px solid var(--line2); background:var(--panel2); color:var(--fg);
    transition:background .15s, border-color .15s, transform .08s, color .15s, opacity .15s;
    white-space:nowrap;
  }
  button:hover:not(:disabled){background:#202632; border-color:rgba(255,255,255,.18)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.38; cursor:not-allowed}
  button.primary{background:rgba(138,164,255,.15); border-color:rgba(138,164,255,.38); color:#c3d0ff}
  button.primary:hover:not(:disabled){background:rgba(138,164,255,.24)}
  button.danger{background:rgba(240,120,138,.12); border-color:rgba(240,120,138,.32); color:#f5a8b4}
  button.danger:hover:not(:disabled){background:rgba(240,120,138,.2)}
  button.ghost{background:transparent}
  button.ghost:hover:not(:disabled){background:rgba(255,255,255,.05)}

  /* ---------- 网格 ---------- */
  main{max-width:1180px; margin:0 auto; padding:22px 24px 60px}
  .grid{
    display:grid; gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  }

  /* ---------- 服务卡 ---------- */
  .svc{
    position:relative; overflow:hidden;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:16px 17px 14px;
    transition:border-color .2s, background .2s, transform .18s, box-shadow .2s;
  }
  .svc::before{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:0;
    transition:opacity .25s;
    background:radial-gradient(420px 160px at 50% -30%, rgba(74,222,128,.16), transparent 70%);
  }
  .svc.up{border-color:rgba(74,222,128,.22); background:linear-gradient(180deg,rgba(74,222,128,.045),var(--panel) 46%)}
  .svc.up::before{opacity:1}
  .svc.idle{opacity:.82}
  .svc.idle:hover{opacity:1}
  .svc.busy{border-color:rgba(138,164,255,.4); box-shadow:0 0 0 1px rgba(138,164,255,.16)}
  .svc.unmanaged{opacity:.68}

  .svc-top{display:flex; align-items:center; gap:10px; position:relative; z-index:1}
  .dot{
    width:9px; height:9px; border-radius:50%; flex:none;
    background:var(--dim2); box-shadow:0 0 0 0 rgba(74,222,128,.5);
    transition:background .2s;
  }
  .svc.up .dot{background:var(--ok); animation:pulse 2.4s ease-out infinite}
  .svc.working .dot{background:var(--warn); animation:pulse 1s ease-out infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(74,222,128,.45)}
    70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}
    100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
  }
  .svc.working .dot{animation-name:pulseWarn}
  @keyframes pulseWarn{
    0%{box-shadow:0 0 0 0 rgba(245,189,98,.5)}
    70%{box-shadow:0 0 0 7px rgba(245,189,98,0)}
    100%{box-shadow:0 0 0 0 rgba(245,189,98,0)}
  }

  .svc h3{margin:0; font-size:14.5px; font-weight:640; letter-spacing:.15px}
  .tag{
    margin-left:auto; font-size:11px; color:var(--dim);
    padding:3px 8px; border-radius:6px; background:rgba(255,255,255,.045);
    border:1px solid var(--line); font-variant-numeric:tabular-nums;
  }
  .desc{
    margin:11px 0 0; font-size:12.5px; line-height:1.65; color:var(--dim);
    min-height:40px; position:relative; z-index:1;
  }
  .status-line{
    margin-top:10px; font-size:12px; color:var(--dim2);
    display:flex; align-items:center; gap:8px; min-height:18px;
    font-variant-numeric:tabular-nums;
  }
  .status-line .st{font-weight:600}
  .svc.up .status-line .st{color:var(--ok)}
  .svc.working .status-line .st{color:var(--warn)}
  .warn{
    margin-top:9px; font-size:11.5px; color:#d9b06a;
    background:rgba(245,189,98,.08); border:1px solid rgba(245,189,98,.16);
    border-radius:7px; padding:5px 9px; display:inline-block;
  }
  /* 待重启：比 .warn 更醒目，因为它是「你现在该做的事」 */
  .stale{
    margin-top:9px; font-size:11.5px; color:#f3cd91; display:block;
    background:rgba(245,189,98,.13); border:1px solid rgba(245,189,98,.32);
    border-radius:7px; padding:6px 9px;
  }
  .stale .fn{color:var(--dim); font-size:10.5px}
  .svc.stale-border{border-color:rgba(245,189,98,.42)}
  .svc.stale-border::after{
    content:''; position:absolute; inset:0; pointer-events:none; border-radius:var(--r);
    box-shadow:inset 0 0 0 1px rgba(245,189,98,.14);
  }
  .actions{
    display:flex; gap:7px; margin-top:13px; padding-top:13px;
    border-top:1px solid var(--line); position:relative; z-index:1;
  }
  .actions button{flex:1; justify-content:center; padding:7px 6px}

  /* ---------- 提示 ---------- */
  #toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,18px);
    display:flex; flex-direction:column; gap:8px; align-items:center;
    z-index:60; pointer-events:none;
  }
  .toast{
    padding:10px 17px; border-radius:11px; font-size:12.5px;
    background:rgba(25,29,39,.96); border:1px solid var(--line2);
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    opacity:0; transform:translateY(10px); transition:opacity .2s, transform .2s;
    max-width:min(560px,90vw);
  }
  .toast.on{opacity:1; transform:translateY(0)}
  .toast.ok{border-color:rgba(74,222,128,.35)}
  .toast.err{border-color:rgba(240,120,138,.4); color:#f5b3bd}

  footer{
    max-width:1180px; margin:0 auto; padding:0 24px 34px;
    font-size:11.5px; color:var(--dim2); line-height:1.9;
  }
  footer code{background:rgba(255,255,255,.05); padding:1px 6px; border-radius:5px; font-size:11px}

  /* ---------- 底部启动日志（2026-11-07） ---------- */
  /* 点完启动不用干等：脚本正在干什么，这里实时流出来 */
  body{padding-bottom:250px}
  .logpanel{
    position:fixed; left:0; right:0; bottom:0; z-index:45;
    background:rgba(11,13,18,.97); border-top:1px solid var(--line2);
    backdrop-filter:blur(14px) saturate(140%);
    box-shadow:0 -10px 30px rgba(0,0,0,.35);
  }
  .loghead{
    display:flex; align-items:center; gap:10px;
    padding:9px 20px; font-size:12px; color:var(--dim);
    border-bottom:1px solid var(--line);
  }
  .loghead b{color:var(--fg); font-weight:600; font-size:12.5px}
  .loghead .spacer{flex:1}
  .loghead button{padding:4px 10px; font-size:11.5px; border-radius:7px}
  .logpanel pre{
    margin:0; padding:10px 20px 14px; max-height:200px; overflow-y:auto;
    font-family:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono",monospace;
    font-size:11.5px; line-height:1.65; color:#c6cee0;
    white-space:pre-wrap; word-break:break-word;
  }
  .logpanel.collapsed pre{display:none}
  .logpanel.collapsed{box-shadow:none}
  .logpanel pre::-webkit-scrollbar{width:9px}
  .logpanel pre::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:5px}

  @media (max-width:640px){
    .bar{padding:13px 16px; gap:11px}
    main{padding:16px 16px 48px}
    .grid{grid-template-columns:1fr}
    .bulk{width:100%}
    .bulk button{flex:1}
  }
  /* ---------- 记忆同步（2026-11-12）----------
     放在页面最底下：先看服务、再回头看记忆。 */
  .mempanel{
    max-width:1132px; margin:0 auto 20px; padding:16px 18px 18px;
    border:1px solid var(--line); border-radius:var(--r); background:var(--panel);
  }
  .memhead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
  .memhead b{font-size:13.5px; font-weight:620}
  .memhead .dim{font-size:12px; color:var(--dim)}
  .memgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}
  .memcard{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
  .memcard .t{font-size:11.5px; color:var(--dim2); margin-bottom:9px; letter-spacing:.4px}
  .memcard .big{font-size:21px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.25}
  .memcard .unit{font-size:12px; color:var(--dim); margin-left:6px; font-weight:400}
  .memcard .row{display:flex; justify-content:space-between; gap:12px; font-size:12px; color:var(--dim); padding:3px 0}
  .memcard .row b{color:var(--fg); font-weight:520; text-align:right; word-break:break-word; max-width:62%}
  .memverdict{display:flex; align-items:center; gap:10px; font-size:12.5px; margin-top:12px}
  .memverdict .dot{width:8px; height:8px; border-radius:50%; background:var(--dim2); flex:none}
  .memverdict.ok{border-color:rgba(74,222,128,.35)} .memverdict.ok .dot{background:var(--ok)}
  .memverdict.warn{border-color:rgba(245,189,98,.42)} .memverdict.warn .dot{background:var(--warn)}
  .memverdict.bad{border-color:rgba(240,120,138,.42)} .memverdict.bad .dot{background:var(--bad)}

  /* 树状图（SVG）：三条泳道，节点按时间排，连线表示「这台机器打的包传到了云端」 */
  .memtreewrap{
    margin-top:14px; padding:6px; max-height:480px; overflow:auto;
    background:var(--panel2); border:1px solid var(--line); border-radius:12px;
  }
  .memtreewrap svg{display:block; width:100%; height:auto}
  @media (max-width:900px){
    .memgrid{grid-template-columns:1fr}
    .mempanel{max-width:none; margin:0 16px 20px}
  }

</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><span class="mark">她</span> 管理器</div>
    <div class="summary" id="summary">探测中…</div>
    <div class="spacer"></div>
    <div class="bulk">
      <button class="primary" id="stalebtn" data-stale disabled>重启待重启</button>
      <button class="primary" data-all="start">全部启动</button>
      <button data-all="restart">全部重启</button>
      <button class="danger" data-all="stop">全部停止</button>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<section class="mempanel" id="mempanel">
  <div class="memhead">
    <b>记忆同步</b>
    <span class="dim" id="meminfo">读取中…</span>
    <div class="spacer"></div>
    <button class="ghost" id="memphone" title="经 USB 探手机容器里的账本，要等几秒">探手机</button>
    <button class="ghost" id="memremote" title="向 GitHub 问一次远端 main 在哪，会等几秒">问云端</button>
    <button class="ghost" id="memrefresh">刷新</button>
  </div>
  <div class="memgrid">
    <div class="memcard" id="memlocal"><div class="t">本机记忆</div><div class="dim" style="font-size:12.5px">读取中…</div></div>
    <div class="memcard" id="memcloud"><div class="t">云端记忆（快照）</div><div class="dim" style="font-size:12.5px">读取中…</div></div>
    <div class="memcard" id="memlast"><div class="t">上次同步</div><div class="dim" style="font-size:12.5px">读取中…</div></div>
  </div>
  <div class="memcard memverdict" id="memverdict"><span class="dot"></span><span class="dim">判定中…</span></div>

  <div class="memtreewrap" id="memtree"></div>
</section>

<footer>
  启动/停止都交给仓库根目录的 <code>launch.mjs</code> / <code>shutdown.mjs</code> / <code>restart.mjs</code>，
  这里不重写一套。<br>
  ASR 听写归你自己的 vs 插件管线管，这里只看不动。<br>
  关掉这个窗口不影响任何服务；要关服务请点上面的按钮。
</footer>

<div id="toast"></div>

<section class="logpanel" id="logpanel">
  <div class="loghead">
    <b>启动日志</b>
    <span id="loginfo" style="font-size:11.5px"></span>
    <div class="spacer"></div>
    <button class="ghost" id="logclear">清空</button>
    <button class="ghost" id="logtoggle">收起</button>
  </div>
  <pre id="logbody">读日志中…</pre>
</section>

<script>
'use strict';

const grid = document.getElementById('grid');
const summaryEl = document.getElementById('summary');
const toastBox = document.getElementById('toast');

// 正在「启动中」的服务：点了启动之后到端口真的开之间，界面要有话说，
// 否则用户会以为没反应又点一次（于是起两份）。
const pending = new Map();   // key -> { until, action }
const PENDING_MS = 45000;

let last = [];        // 最近一次探测结果
let busy = '';        // 服务端当前的忙标记
let reqSeq = 0;

function toast(text, kind) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = text;
  toastBox.appendChild(el);
  requestAnimationFrame(() => el.classList.add('on'));
  setTimeout(() => {
    el.classList.remove('on');
    setTimeout(() => el.remove(), 260);
  }, 2800);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function fmtSince() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
}

function stateOf(s) {
  const p = pending.get(s.key);
  if (p && Date.now() < p.until) {
    if (s.up && p.action !== 'stop') pending.delete(s.key);
    else return p.action === 'stop' ? 'working' : 'working';
  } else if (p) {
    pending.delete(s.key);
  }
  return s.up ? 'up' : 'idle';
}

function statusText(s, st) {
  const p = pending.get(s.key);
  if (st === 'working') {
    if (p && p.action === 'stop') return '正在关闭…';
    if (p && p.action === 'restart') return '正在重启…';
    return '正在启动…';
  }
  if (s.up) return '运行中' + (s.pid ? ' · PID ' + s.pid : '');
  return '已停止';
}

function render() {
  const total = last.length;
  const up = last.filter(s => s.up).length;
  const managed = last.filter(s => s.managed).length;
  const upManaged = last.filter(s => s.managed && s.up).length;
  const staleCount = last.filter(s => s.stale).length;
  const gridBusy = !!busy;

  summaryEl.innerHTML =
    '<b>' + upManaged + '/' + managed + '</b> 运行中' +
    (staleCount ? ' · <b style="color:#f5bd62">' + staleCount + '</b> 个待重启' : '') +
    (total !== managed ? ' · <b>' + (up - upManaged) + '</b> 外部服务在线' : '') +
    ' · ' + fmtSince();

  // 一键重启待重启：没有目标就禁用，有目标高亮并带数量
  const staleBtn = document.getElementById('stalebtn');
  if (staleBtn) {
    staleBtn.textContent = staleCount ? '重启待重启（' + staleCount + '）' : '没有待重启';
    staleBtn.disabled = !staleCount || gridBusy;
    staleBtn.classList.toggle('primary', !!staleCount);
  }

  grid.innerHTML = last.map(s => {
    const st = stateOf(s);
    const cls = ['svc', st, s.managed ? '' : 'unmanaged', gridBusy ? 'busy' : '', s.stale ? 'stale-border' : ''].filter(Boolean).join(' ');
    const dis = (!s.managed || gridBusy || st === 'working') ? ' disabled' : '';

    return '<article class="' + cls + '" data-key="' + esc(s.key) + '">' +
      '<div class="svc-top">' +
        '<span class="dot"></span>' +
        '<h3>' + esc(s.name) + '</h3>' +
        '<span class="tag">' + esc(s.tag) + '</span>' +
      '</div>' +
      '<p class="desc">' + esc(s.desc) + '</p>' +
      '<div class="status-line"><span class="st">' + esc(statusText(s, st)) + '</span></div>' +
      (s.stale
        ? '<span class="stale">代码有改动，<b>需要重启</b> <span class="fn">' + esc(s.staleFile) + '</span></span>'
        : (s.unknownStart ? '<span class="stale">启动时间不明——如果改过代码，建议重启 <span class="fn">' + esc(s.staleFile) + '</span></span>' : '')) +
      (s.warn ? '<div class="warn">' + esc(s.warn) + '</div>' : '') +
      '<div class="actions">' +
        '<button class="primary" data-a="start"' + dis + '>启动</button>' +
        '<button class="ghost" data-a="restart"' + dis + '>重启</button>' +
        '<button class="danger" data-a="stop"' + dis + '>停止</button>' +
      '</div>' +
    '</article>';
  }).join('');
}

async function refresh() {
  const seq = ++reqSeq;
  try {
    const r = await fetch('/api/services', { cache: 'no-store' });
    const j = await r.json();
    if (seq !== reqSeq) return;          // 有更新的请求了，丢掉这次
    last = j.services || [];
    busy = j.busy || '';
    render();
  } catch (e) {
    summaryEl.textContent = '连不上管理器';
  }
}

// 底部启动日志（2026-11-07）：脚本正在干什么实时流出来，不用干等
const logBody = document.getElementById('logbody');
const logInfo = document.getElementById('loginfo');

async function refreshLogs() {
  try {
    const r = await fetch('/api/logs?lines=400', { cache: 'no-store' });
    const j = await r.json();
    // 用户往上翻了就别抢他的滚动位置（tail -f 的规矩）
    const atBottom = logBody.scrollHeight - logBody.scrollTop - logBody.clientHeight < 40;
    const text = (j.lines || []).join('\n');
    if (logBody.textContent !== text) {
      logBody.textContent = text;
      if (atBottom) logBody.scrollTop = logBody.scrollHeight;
    }
    logInfo.textContent = j.total ? j.total + ' 行' : '';
  } catch (e) {
    logInfo.textContent = '连不上';
  }
}

async function act(key, action, name) {
  pending.set(key, { until: Date.now() + PENDING_MS, action });
  render();
  try {
    const r = await fetch('/api/action', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ key, action }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) {
      pending.delete(key);
      toast(j.error || ('操作失败（HTTP ' + r.status + '）'), 'err');
      render();
      return;
    }
    toast(j.message || '已发出', 'ok');
    setTimeout(refresh, 700);
  } catch (e) {
    pending.delete(key);
    toast('连不上管理器：' + e.message, 'err');
    render();
  }
}

async function actAll(action) {
  const label = { start: '全部启动', stop: '全部停止', restart: '全部重启' }[action] || action;
  if (action !== 'start' && !confirm(label + '？\n\n这会动到所有服务（DSH 重启会断她会话）。')) return;
  busy = label;
  render();
  try {
    const r = await fetch('/api/all', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) { toast(j.error || '操作失败', 'err'); return }
    toast(j.message || '已发出', 'ok');
    setTimeout(refresh, 1200);
  } catch (e) {
    toast('连不上管理器：' + e.message, 'err');
  } finally {
    setTimeout(() => { busy = ''; refresh() }, 2600);
  }
}

// 一键重启「需要重启的服务」（2026-11-07）：只动卡片上标着橙色「需要重启」的。
// 启动时间不明的（多半是手动起的）不算，弹窗里说清楚，要动就单独点。
async function actStale() {
  const targets = last.filter(s => s.stale && s.managed);
  if (!targets.length) return;
  const names = targets.map(s => s.name).join('、');
  const dsh = targets.find(s => s.key === 'dsh');
  const unknown = last.filter(s => s.unknownStart).length;
  let msg = '重启这些服务：' + names + '。';
  if (dsh) msg += '\n\n⚠️ DSH 重启会断她当前会话。';
  if (unknown) msg += '\n\n另有 ' + unknown + ' 项「启动时间不明」，这次不动——要动就在它的卡片上单独点重启。';
  if (!confirm(msg + '\n\n现在开始吗？')) return;
  // 每张目标卡先进「正在重启…」状态；服务真正回来（up）时 stateOf 会自动清掉。
  // 时限给宽些：串行重启 + DSH 慢退出，一项最多可能等 20 秒。
  targets.forEach(t => pending.set(t.key, { until: Date.now() + targets.length * 90_000, action: 'restart' }));
  busy = '重启待重启';
  render();
  try {
    const r = await fetch('/api/restart-stale', { method: 'POST' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) {
      targets.forEach(t => pending.delete(t.key));
      toast(j.error || '操作失败', 'err');
      render();
      return;
    }
    if (!j.count) { targets.forEach(t => pending.delete(t.key)); toast(j.message || '没有需要重启的服务', 'ok'); render(); return }
    toast(j.message, 'ok');
    setTimeout(refresh, 1200);
  } catch (e) {
    targets.forEach(t => pending.delete(t.key));
    toast('连不上管理器：' + e.message, 'err');
  } finally {
    setTimeout(() => { busy = ''; refresh() }, targets.length * 3000);
  }
}

// ---------------------------------------------------------------- 记忆同步
//
// 只显示现状，不在这里做同步动作（同步归 sync.mjs）。
// 默认不联网：ls-remote 在慢网要十几秒，页面会像死了一样；
// 要真问远端就点「问一下云端」，那条路带 remote=1 且服务端限时。

function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + 'B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + 'KB';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + 'MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + 'GB';
}

function fmtWhen(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  const p = n => String(n).padStart(2, '0');
  const hm = p(d.getHours()) + ':' + p(d.getMinutes());
  const sameDay = d.toDateString() === new Date().toDateString();
  return sameDay ? hm : (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
}

function renderMemory(d) {
  const info = document.getElementById('meminfo');
  const localEl = document.getElementById('memlocal');
  const cloudEl = document.getElementById('memcloud');
  const lastEl = document.getElementById('memlast');
  const verdictEl = document.getElementById('memverdict');
  const treeEl = document.getElementById('memtree');

  if (!d || d.error) {
    info.textContent = '读不到：' + ((d && d.error) || '未知原因');
    return;
  }
  info.textContent = '读于 ' + fmtWhen(d.at);

  const L = d.local || {};
  const led = L.ledger || {};
  const recent = led.recent || [];
  // 最后一条「有内容」的（meta 多半是 seen/talk 记账，看着像噪音，但可能是唯一一条）
  const ev = recent.find(e => e.type && e.type !== 'meta') || recent[0] || {};
  localEl.innerHTML = `
    <div class="t">本机记忆</div>
    <div class="big">${led.ok ? led.lines : '—'}<span class="unit">条事件</span></div>
    <div class="row"><span>最后写入</span><b>${esc(fmtWhen(led.mtime))}</b></div>
    <div class="row"><span>最后一条</span><b>${esc((ev.type || '—') + (ev.text ? ' · ' + ev.text.slice(0, 40) : ''))}</b></div>
    <div class="row"><span>目录</span><b>${esc(fmtBytes(L.dirBytes))} / ${esc(L.files || 0)} 个文件</b></div>
  `;

  const C = d.cloud || {};
  const lm = C.localMain || {};
  let remoteLine = '未问（点右上「问一下云端」）';
  if (C.reachable === true) remoteLine = '一致 · ' + String(C.remoteMain || '').slice(0, 7);
  else if (C.reachable === false) remoteLine = '问不到：' + (C.remoteError || '网络不通');
  else if (C.originMain) remoteLine = '上次 fetch 记的是 ' + String(C.originMain).slice(0, 7);
  cloudEl.innerHTML = `
    <div class="t">云端记忆（快照）</div>
    <div class="big">${esc(String(lm.sha || '').slice(0, 7) || '—')}<span class="unit">${esc(fmtWhen(lm.at))}</span></div>
    <div class="row"><span>快照说明</span><b>${esc(lm.subject || '—')}</b></div>
    <div class="row"><span>包大小</span><b>${esc(fmtBytes(C.pkgBytes))}</b></div>
    <div class="row"><span>远端</span><b>${esc(remoteLine)}</b></div>
  `;

  const s = L.lastSync;
  lastEl.innerHTML = `
    <div class="t">上次同步</div>
    <div class="big">${esc(s && s.decision ? s.decision : '—')}<span class="unit">${esc(s && s.at ? fmtWhen(s.at) : '')}</span></div>
    <div class="row"><span>上次备份成功</span><b>${esc(fmtWhen((d.verdict || {}).backupAt))}</b></div>
    <div class="row"><span>备份记录</span><b>${s ? '有' : '没有'}</b></div>
    <div class="row"><span>云端仓库</span><b>${esc(C.ok ? '可读' : (C.error || '读不到'))}</b></div>
  `;

  const v = d.verdict || {};
  const cls = v.kind === 'same' ? 'ok' : v.kind === 'local-newer' ? 'warn' : v.kind === 'unknown' ? '' : 'bad';
  verdictEl.className = 'memcard memverdict ' + cls;
  verdictEl.innerHTML = `<span class="dot"></span><span>${esc(v.note || '—')}</span>`;

  renderTree(treeEl, d);
}

/**
 * 树状图（2026-11-12 用户要的形态）。
 *
 * 三条泳道：手机 / 本机 / 云端，各画各的节点，按时间从上往下排（新的在上）。
 * 节点内容来自两处：
 *   · vault/history.jsonl —— 每台设备打包时明文留下的「时间 / 设备 / 条数 / 大小」
 *   · git log main —— 云端真正收下的快照
 * 当一个打包节点与某个快照时间接近（10 分钟内），就在两条泳道之间画一条曲线，
 * 表示「这次打包进到了那个快照」。没有留痕的老快照只出现在云端泳道里。
 */
function renderTree(box, d) {
  const W = 1000;
  const lanes = [
    { key: 'phone', x: 20, cx: 160, label: '手机', color: '#a78bfa' },
    { key: 'pc', x: 360, cx: 500, label: '本机', color: '#4ade80' },
    { key: 'cloud', x: 700, cx: 840, label: '云端', color: '#8aa4ff' },
  ];
  const C = d.cloud || {};
  const P = d.phone;
  const ev = [];

  // 打包留痕（有设备端）
  for (const u of (C.uploads || [])) {
    const isPhone = u.device === 'phone';
    ev.push({
      at: u.at,
      lane: isPhone ? 'phone' : 'pc',
      title: isPhone ? '手机打包' : '电脑打包',
      sub: (u.ledger || 0) + ' 条 · ' + fmtBytes(u.bytes),
      kind: 'pack',
    });
  }
  // 本机按天写了多少（没有打包留痕时，本机泳道至少不是空的）
  if (!(C.uploads || []).some((u) => u.device !== 'phone')) {
    for (const day of (d.byDay || []).slice(0, 4)) {
      ev.push({
        at: day.lastAt || (day.day + 'T00:00:00Z'),
        lane: 'pc',
        title: day.day.slice(5) + ' 写了 ' + day.count + ' 条',
        sub: '',
        kind: 'write',
      });
    }
  }
  // 手机探到的现状（没探过就不画，别拿假的凑数）
  if (P && P.ok) {
    ev.push({
      at: P.mtime || d.at,
      lane: 'phone',
      title: '手机账本 ' + (P.lines || 0) + ' 条',
      sub: P.lastSync && P.lastSync.decision ? 'sync: ' + P.lastSync.decision : '',
      kind: 'now',
    });
  }
  // 云端快照
  for (const h of (C.history || [])) {
    ev.push({ at: h.at, lane: 'cloud', title: '快照 ' + h.sha, sub: h.subject || '', kind: 'snap' });
  }

  ev.sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0));
  const rows = ev.slice(0, 14);

  // 一个节点都没有时也要把三条泳道画出来：否则「手机 未探测」这件事就看不见了，
  // 界面会变成一句「还没有节点」，人不知道该去点哪儿。
  const top = 64;
  const rowH = 74;
  const H = top + Math.max(rows.length, 1) * rowH + 18;
  const e2 = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const out = [];

  for (const l of lanes) {
    out.push(`<rect x="${l.x}" y="10" width="280" height="${H - 22}" rx="14" fill="rgba(255,255,255,0.022)" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>`);
    out.push(`<text x="${l.cx}" y="30" text-anchor="middle" font-size="12" fill="#5f6779" font-family="inherit">${l.label}</text>`);
    const hint = l.key === 'phone'
      ? (!P ? '未探测' : P.ok ? (P.lines || 0) + ' 条' : '连不上')
      : l.key === 'cloud' ? 'fish-vault · main' : '这台电脑';
    out.push(`<text x="${l.cx}" y="46" text-anchor="middle" font-size="10.5" fill="#444b5c" font-family="inherit">${e2(hint)}</text>`);
    out.push(`<line x1="${l.cx}" y1="${top - 18}" x2="${l.cx}" y2="${H - 26}" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>`);
  }

  const ys = rows.map((_, i) => top + i * rowH);
  const cloudRows = rows.map((e, i) => ({ e, i })).filter((x) => x.e.lane === 'cloud');

  // 打包 → 快照 的连线（10 分钟内算同一次）
  rows.forEach((e, i) => {
    if (e.lane === 'cloud' || e.kind !== 'pack') return;
    const t = new Date(e.at).getTime();
    const near = cloudRows
      .map((c) => ({ ...c, dt: Math.abs(new Date(c.e.at).getTime() - t) }))
      .filter((c) => c.dt < 10 * 60_000)
      .sort((a, b) => a.dt - b.dt)[0];
    if (!near) return;
    const from = lanes.find((l) => l.key === e.lane);
    const to = lanes.find((l) => l.key === 'cloud');
    const x1 = from.cx + 8;
    const y1 = ys[i];
    const x2 = to.cx - 8;
    const y2 = ys[near.i];
    const mx = (x1 + x2) / 2;
    out.push(`<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" fill="none" stroke="rgba(138,164,255,0.35)" stroke-width="1.2" stroke-dasharray="3 3"/>`);
  });

  rows.forEach((e, i) => {
    const l = lanes.find((x) => x.key === e.lane) || lanes[1];
    const y = ys[i];
    const hollow = e.kind === 'write';
    out.push(`<circle cx="${l.cx}" cy="${y}" r="5.5" fill="${hollow ? 'none' : l.color}" stroke="${hollow ? l.color : '#14171f'}" stroke-width="2"/>`);
    out.push(`<text x="${l.cx}" y="${y - 13}" text-anchor="middle" font-size="10.5" fill="#5f6779" font-family="inherit">${e2(fmtWhen(e.at))}</text>`);
    out.push(`<text x="${l.cx}" y="${y + 21}" text-anchor="middle" font-size="12.5" fill="#e9ebf2" font-family="inherit">${e2(e.title)}</text>`);
    if (e.sub) out.push(`<text x="${l.cx}" y="${y + 38}" text-anchor="middle" font-size="10.5" fill="#8b93a7" font-family="inherit">${e2(String(e.sub).slice(0, 28))}</text>`);
  });

  // 底部一条注：说明这份图的口径
  const note = rows.length === 0
    ? '还没有任何节点：账本、快照、留痕都还是空的'
    : (C.uploads || []).length
      ? '圆点＝一次打包留痕（设备端/时间/条数），虚线＝这次打包对应上的云端快照'
      : '还没有打包留痕：下次备份起，每台设备都会在本泳道留下「时间 + 条数 + 大小」';
  out.push(`<text x="${W / 2}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="#444b5c" font-family="inherit">${e2(note)}</text>`);

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"><title>记忆修改树</title><desc>手机、本机、云端三条泳道的记忆节点与它们之间的关系</desc>${out.join('')}</svg>`;
}

// 手机探测很重（adb + ssh），只在点了才跑；轮询带回来的数据里没有 phone 字段，
// 所以把上次探到的结果留着，别让 30 秒一次的轮询把它擦掉。
let lastPhone = null;

async function refreshMemory(opts) {
  const o = opts || {};
  const info = document.getElementById('meminfo');
  const q = [];
  if (o.remote) q.push('remote=1');
  if (o.phone) q.push('phone=1');
  info.textContent = o.phone
    ? '正在经 USB 问手机（要几秒）…'
    : o.remote ? '正在问云端（可能要几秒）…' : '读取中…';
  try {
    const r = await fetch('/api/memory' + (q.length ? '?' + q.join('&') : ''));
    const d = await r.json();
    if (d && d.phone) lastPhone = d.phone;
    else if (lastPhone && d) d.phone = lastPhone;
    renderMemory(d);
  } catch (e) {
    info.textContent = '读不到：' + e.message;
  }
}

document.getElementById('memrefresh').addEventListener('click', () => refreshMemory({}));
document.getElementById('memremote').addEventListener('click', () => refreshMemory({ remote: true }));
document.getElementById('memphone').addEventListener('click', () => refreshMemory({ phone: true }));
refreshMemory({});
// 记忆不会每两秒变一次，跟服务探测分开轮询
setInterval(() => refreshMemory({}), 30000);
</script>
